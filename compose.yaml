# Arivu as a two-service Docker Compose stack: the Go app and the isolated
# browser-capture helper. Built for container PaaS hosts such as Dokploy and
# works with plain `docker compose` on any Docker host.
#
# Nothing is published on the host. A reverse proxy on the same Docker network
# terminates TLS and forwards to arivu:8080. Every setting comes from the
# environment (or a .env file next to this file); compose refuses to start
# while a required one is missing. See openwiki/operations/deployment.md
# ("Compose / PaaS") for the full guide, data migration, and admin commands.
#
# The native installer (arivu-installer, systemd) is unchanged and does not
# use this file.

name: arivu

services:
  arivu:
    build:
      context: .
      args:
        ARIVU_VERSION: ${ARIVU_VERSION:-}
    image: arivu:${ARIVU_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["serve"]
    environment:
      ARIVU_ADDR: ":8080"
      ARIVU_DB: /data/arivu.sqlite3
      APP_URL: ${APP_URL:?set the public https URL, for example https://app.arivu.app}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set the comma-separated admin emails}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (reuse the old one when moving an existing install)}
      ARIVU_FETCH_USER_AGENT: ${ARIVU_FETCH_USER_AGENT:-Arivu/2.0}
      # Complete browser capture, configured as arivu-installer does today.
      ARIVU_BROWSER_CAPTURE_ENABLED: ${ARIVU_BROWSER_CAPTURE_ENABLED:-true}
      ARIVU_BROWSER_CAPTURE_PROTOCOL: "2"
      ARIVU_BROWSER_CAPTURE_SOCKET: /run/arivu-capture/helper.sock
      ARIVU_BROWSER_CAPTURE_RUNTIME_DIR: /run/arivu-capture/attempts
      ARIVU_BROWSER_CAPTURE_SCREENSHOT: ${ARIVU_BROWSER_CAPTURE_SCREENSHOT:-true}
      ARIVU_BROWSER_CAPTURE_PDF: ${ARIVU_BROWSER_CAPTURE_PDF:-false}
      ARIVU_BROWSER_CAPTURE_SELF_CONTAINED_HTML: ${ARIVU_BROWSER_CAPTURE_SELF_CONTAINED_HTML:-true}
      ARIVU_BROWSER_CAPTURE_TIMEOUT: ${ARIVU_BROWSER_CAPTURE_TIMEOUT:-90s}
      ARIVU_BROWSER_CAPTURE_NAVIGATION_TIMEOUT: ${ARIVU_BROWSER_CAPTURE_NAVIGATION_TIMEOUT:-30s}
      ARIVU_BROWSER_CAPTURE_MAX_FILE_BYTES: ${ARIVU_BROWSER_CAPTURE_MAX_FILE_BYTES:-52428800}
      ARIVU_BROWSER_CAPTURE_MAX_TOTAL_BYTES: ${ARIVU_BROWSER_CAPTURE_MAX_TOTAL_BYTES:-104857600}
      ARIVU_BROWSER_CAPTURE_MAX_MEDIA_FILES: ${ARIVU_BROWSER_CAPTURE_MAX_MEDIA_FILES:-40}
      ARIVU_BROWSER_CAPTURE_MAX_MEDIA_FILE_BYTES: ${ARIVU_BROWSER_CAPTURE_MAX_MEDIA_FILE_BYTES:-5242880}
      ARIVU_BROWSER_CAPTURE_MAX_MEDIA_TOTAL_BYTES: ${ARIVU_BROWSER_CAPTURE_MAX_MEDIA_TOTAL_BYTES:-41943040}
    volumes:
      # Database, assets, and `arivu backup` output (/data/backups).
      - arivu-data:/data
      - capture-socket:/run/arivu-capture
    tmpfs:
      # Holds each validated capture result until it is ingested; sized above
      # the 100 MiB capture total plus 40 MiB of reader media.
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]
    # Declared here, not through a YAML anchor: Dokploy rewrites this key when
    # it attaches its proxy network to the service that has the domain.
    networks:
      - default
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/arivu", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      # Ordering only, like the systemd units: Arivu keeps saving through its
      # direct-HTTP path if the helper is down.
      capture:
        condition: service_started

  # Renders untrusted pages in headless Chromium, so it gets nothing else: no
  # network (it reaches the web only through the per-attempt proxy socket the
  # app creates), no data volume, no secrets, no capabilities, and a read-only
  # root. This matches the systemd unit's PrivateNetwork=true and empty
  # CapabilityBoundingSet.
  capture:
    build:
      context: ./capture
    image: arivu-capture:${ARIVU_IMAGE_TAG:-local}
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      # Chromium profiles, its shared memory (Playwright passes
      # --disable-dev-shm-usage), and per-attempt scratch files.
      - /tmp:size=${ARIVU_CAPTURE_TMP_SIZE:-1g},mode=1777
    mem_limit: ${ARIVU_CAPTURE_MEM_LIMIT:-1536m}
    memswap_limit: ${ARIVU_CAPTURE_MEM_LIMIT:-1536m}
    # Same task cap as the systemd unit (TasksMax=512). The open-file limit is
    # left at the Docker daemon default so the stack starts on any host.
    pids_limit: 512
    volumes:
      - capture-socket:/run/arivu-capture
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(process.env.ARIVU_CAPTURE_SOCKET).on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  # Everything that needs a backup: arivu.sqlite3 (+ WAL), arivu.sqlite3.assets,
  # and backups/ from `arivu backup`.
  arivu-data:
  # Only Unix sockets and per-attempt directories; a small tmpfs that starts
  # empty. Owned by the helper (uid 10002) and the shared arivu group (gid
  # 10001), mode 0770, like the systemd RuntimeDirectory.
  capture-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=8m,uid=10002,gid=10001,mode=0770

networks:
  default:
