name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: deepseek/deepseek-v4.1-flash
          LANGCHAIN_TRACING_V2: "false"

      - name: Keep workflow configuration maintainer-controlled
        run: |
          git restore -- .github/workflows/openwiki-update.yml
          git restore -- openwiki/operations/dependency-policy.md
          git restore -- openwiki/operations/github-wiki.md
          git clean -f -- CLAUDE.md

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            openwiki
            AGENTS.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
