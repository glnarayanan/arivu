name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          LANGCHAIN_TRACING_V2: "false"

      - name: Keep workflow configuration maintainer-controlled
        run: |
          git restore -- .github/workflows/openwiki-update.yml
          git restore -- openwiki/operations/dependency-policy.md
          git restore -- openwiki/operations/github-wiki.md
          git clean -f -- CLAUDE.md

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
