name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...
      - run: node --check internal/app/web/app.js
      - run: node --test internal/app/webtest/*.test.mjs
      - run: node --check extension/popup.js
      - run: node --check extension/background.js
      - run: node --check extension/content.js
      - run: node --check extension/url-utils.js
      - run: node extension/url-utils.test.mjs
      - run: node extension/content.test.mjs
      - name: Verify isolated capture bundle
        run: |
          npm ci --prefix capture
          npm test --prefix capture
          npm audit --omit=dev --prefix capture
          docker build -t arivu-capture:test capture
          docker compose -f deploy/compose.yaml config >/dev/null
          systemd-analyze verify deploy/arivu-capture.service
          tar -czf /tmp/arivu-capture-bundle.tgz \
            -C capture package.json package-lock.json src README.md Dockerfile \
            -C ../deploy arivu-capture.service
          tar -tzf /tmp/arivu-capture-bundle.tgz | grep -qx arivu-capture.service
      - run: go test ./...
      - name: Build release artifact
        run: |
          mkdir -p /tmp/arivu-artifacts
          go build -trimpath -ldflags="-s -w" -o /tmp/arivu-artifacts/arivu ./cmd/arivu
          go version -m /tmp/arivu-artifacts/arivu > /tmp/arivu-artifacts/buildinfo.txt
          go list -m -json all > /tmp/arivu-artifacts/go-modules.inventory.jsonl
          (cd /tmp/arivu-artifacts && sha256sum arivu buildinfo.txt go-modules.inventory.jsonl > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: arivu-linux-amd64-supply-chain
          path: |
            /tmp/arivu-artifacts/arivu
            /tmp/arivu-artifacts/buildinfo.txt
            /tmp/arivu-artifacts/go-modules.inventory.jsonl
            /tmp/arivu-artifacts/SHA256SUMS
          retention-days: 14
